[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ny-oca-conviction"
version = "0.1.0"
description = "Research-only OCA-STAT conviction modeling pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "pyarrow>=16,<22",
  "pydantic>=2.9,<3.0",
  "PyYAML>=6.0,<7.0",
  "rich>=13.9,<15.0",
  "scikit-learn>=1.5,<2.0",
  "typer>=0.15,<1.0",
]

[project.scripts]
ny-oca-conviction = "ny_oca_conviction.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ny_oca_conviction"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.11,<1.0",
]

[tool.uv]
default-groups = ["dev"]
